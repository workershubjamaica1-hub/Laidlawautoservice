<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in | Laidlaw Auto Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1D2731; --ink-soft: #4A5663; --surface: #E6E9EC; --card: #FBFBFA; --line: #C9CFD5;
    --safety: #F2B705; --red: #B83A2B;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font: 16px/1.5 var(--body); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }

  header { background: var(--ink); color: #fff; padding: 14px 24px; border-bottom: 6px solid var(--safety); }
  header h1 { font: 700 28px/1 var(--display); margin: 0; }

  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
  h2 { font: 700 28px/1.1 var(--display); margin: 0 0 4px; }
  .sub { color: var(--ink-soft); margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 4px; }
  .pw { position: relative; }
  input { width: 100%; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .pw input { padding-right: 64px; }
  .show { position: absolute; right: 4px; top: 4px; bottom: 4px; padding: 0 10px; background: none; border: 0; color: var(--ink-soft); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn { width: 100%; margin-top: 18px; padding: 11px 16px; background: var(--safety); color: var(--ink); border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #FFC81F; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--red); font-size: 14px; margin: 10px 0 0; min-height: 1.4em; }
  .back { display: block; text-align: center; margin-top: 14px; color: var(--ink-soft); font-size: 15px; }
</style>
</head>
<body>
<header><h1>Laidlaw Auto Services</h1></header>
<main>
  <form class="card" id="form">
    <h2>Admin sign in</h2>
    <p class="sub">Staff only. Enter the admin password to continue.</p>
    <label for="pw">Password</label>
    <div class="pw">
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button type="button" class="show" id="show" aria-controls="pw">Show</button>
    </div>
    <button class="btn" id="submit" type="submit">Sign in</button>
    <p class="error" id="error" role="alert"></p>
    <a class="back" href="/">← Back to site</a>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);

// Already signed in? Go straight to the portal (admin.html sends you back here if the token has expired)
try { if (sessionStorage.getItem('adminToken')) location.replace('/admin.html'); } catch (e) {}

$('show').addEventListener('click', () => {
  const hidden = $('pw').type === 'password';
  $('pw').type = hidden ? 'text' : 'password';
  $('show').textContent = hidden ? 'Hide' : 'Show';
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('error').textContent = '';
  $('submit').disabled = true;
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Could not sign in.');
    sessionStorage.setItem('adminToken', body.token);
    location.replace('/admin.html');
  } catch (err) {
    $('error').textContent = err.message;
    $('pw').select();
  } finally {
    $('submit').disabled = false;
  }
});
</script>
</body>
</html>
