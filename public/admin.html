<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | Laidlaw Auto Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1D2731; --ink-soft: #4A5663; --surface: #E6E9EC; --card: #FBFBFA; --line: #C9CFD5;
    --safety: #F2B705; --red: #B83A2B; --green: #2F7A4D; --blue: #2D5F8A;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 16px/1.5 var(--body); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
  [hidden] { display: none !important; }

  header { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 6px solid var(--safety); }
  header h1 { font: 700 28px/1 var(--display); margin: 0; }
  header .sp { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  header a { color: #B9C3CC; font-size: 15px; }

  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
  h2 { font: 700 24px/1.1 var(--display); margin: 0 0 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 20px; }

  label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .btn { padding: 8px 14px; background: var(--ink); color: #fff; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #2C3A47; }
  .btn.safety { background: var(--safety); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--surface); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn.danger:hover { background: var(--red); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 14px; }
  .error { color: var(--red); font-size: 14px; margin: 8px 0 0; min-height: 1.4em; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--safety); border-radius: 6px; padding: 12px 16px; }
  .stat[data-s="in-progress"] { border-top-color: var(--blue); }
  .stat[data-s="completed"] { border-top-color: var(--green); }
  .stat[data-s="cancelled"] { border-top-color: var(--ink-soft); }
  .stat b { display: block; font: 700 36px/1 var(--display); }
  .stat span { color: var(--ink-soft); font-size: 14px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { background: transparent; border: 1px solid var(--line); border-radius: 20px; padding: 5px 16px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .toolbar { display: grid; grid-template-columns: 1fr 200px; gap: 10px; margin-bottom: 12px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font: 600 15px var(--display); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
  td select { width: auto; padding: 4px 6px; }
  td.desc { max-width: 340px; overflow-wrap: anywhere; }
  td.act { white-space: nowrap; text-align: right; }
  small { color: var(--ink-soft); }
  .empty { color: var(--ink-soft); margin: 8px 0 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--safety); color: var(--ink); }
  .badge[data-s="in-progress"] { background: var(--blue); color: #fff; }
  .badge[data-s="completed"] { background: var(--green); color: #fff; }
  .badge[data-s="cancelled"] { background: var(--ink-soft); color: #fff; }

  .userform { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .badge.off { background: var(--red); color: #fff; }
  .emerg { background: #fff; border: 1px solid var(--line); border-left: 8px solid var(--red); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .emerg.dispatched { border-left-color: var(--blue); }
  .emerg.resolved, .emerg.cancelled { border-left-color: var(--line); opacity: .75; }
  .emerg.towing .kind { background: #A34A0A; }
  .emerg .kind { display: inline-block; background: var(--red); color: #fff; font: 700 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; }
  .emerg .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 130px; }
  .emerg .acts .btn { margin: 0; }
  .emerg p { margin: 4px 0 0; }
  .pending { border: 2px dashed var(--safety); background: #FFFBEA; border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; }
  .pending .app { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  @media (max-width: 640px) { .emerg, .pending .app { grid-template-columns: 1fr; } .emerg .acts { flex-direction: row; } }
  .parishbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .parishbar label { margin: 0; }
  .parishbar select { width: auto; min-width: 180px; }
  .who { display: block; line-height: 1.35; }
  @media (max-width: 900px) { .userform { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { main { padding: 14px; } .toolbar { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="portalTitle">Laidlaw Auto Services</h1>
    <div class="sp">
      <span id="who" style="color:#fff;font-weight:600"></span>
      <button class="btn ghost small" id="refresh" style="color:#fff;border-color:#4A5663">Refresh</button>
      <button class="btn safety small" id="logout">Log out</button>
    </div>
  </header>
  <main>
    <p class="error" id="appError" role="alert"></p>
    <div class="stats" id="stats"></div>

    <div class="parishbar">
      <label for="parishFilter">Parish</label>
      <select id="parishFilter"><option value="">All parishes</option></select>
    </div>

    <div class="tabs" role="group" aria-label="Section">
      <button data-tab="emergencies" id="emergTab" aria-pressed="true">Emergencies</button>
      <button data-tab="requests" aria-pressed="false">Service requests</button>
      <button data-tab="vehicles" aria-pressed="false">Vehicles</button>
      <button data-tab="users" id="usersTab" aria-pressed="false" hidden>Users</button>
    </div>

    <div class="panel" id="emergPanel">
      <div class="toolbar" style="grid-template-columns: 1fr auto; align-items: center">
        <span class="empty" id="emergNote" style="margin:0"></span>
        <label style="margin:0; display:flex; gap:6px; align-items:center"><input type="checkbox" id="emergSound" checked style="width:auto"> Sound alert for new emergencies</label>
      </div>
      <div id="emergList"></div>
      <p class="empty" id="emergEmpty" hidden>No emergency requests right now.</p>
    </div>

    <div class="panel" id="requestsPanel" hidden>
      <div class="toolbar">
        <input id="reqSearch" type="search" placeholder="Search owner, vehicle or description" aria-label="Search requests">
        <select id="reqStatus" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in-progress">In progress</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Vehicle</th><th>Problem</th><th>Status</th><th>Opened</th><th></th></tr></thead>
        <tbody id="reqBody"></tbody>
      </table></div>
      <p class="empty" id="reqEmpty" hidden>No matching requests.</p>
    </div>

    <div class="panel" id="usersPanel" hidden>
      <div id="pendingBox" class="pending" hidden></div>
      <form id="userForm" class="userform">
        <input id="uName" placeholder="Full name" aria-label="Full name" required>
        <input id="uEmail" type="email" placeholder="Email" aria-label="Email" required>
        <input id="uPass" type="text" placeholder="Temporary password (8+ characters)" aria-label="Temporary password" required minlength="8" autocomplete="off">
        <select id="uRole" aria-label="Role"><option value="staff">Staff</option><option value="admin">Admin</option><option value="customer">Customer</option></select>
        <input id="uPhone" type="tel" placeholder="Phone (optional)" aria-label="Phone" autocomplete="off">
        <select id="uParish" aria-label="Parish"><option value="">Parish (technicians: set this)</option></select>
        <button class="btn safety" type="submit">Add user</button>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Contact</th><th>Role</th><th>Parish</th><th>Status</th><th></th></tr></thead>
        <tbody id="userBody"></tbody>
      </table></div>
    </div>

    <div class="panel" id="vehiclesPanel" hidden>
      <div class="toolbar">
        <input id="vehSearch" type="search" placeholder="Search owner, vehicle or VIN" aria-label="Search vehicles">
        <span></span>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Owner</th><th>Vehicle</th><th>Year</th><th>VIN</th><th>Jobs</th><th></th></tr></thead>
        <tbody id="vehBody"></tbody>
      </table></div>
      <p class="empty" id="vehEmpty" hidden>No matching vehicles.</p>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const STATUS_LABELS = { 'pending': 'Pending', 'in-progress': 'In progress', 'completed': 'Completed', 'cancelled': 'Cancelled' };
let token = '';
try { token = localStorage.getItem('authToken') || ''; } catch (e) {}
let data = null;
let users = [];
let parishes = [];
let me = null; // the signed-in user; admins see the Users tab and delete buttons, staff do not

// Builds an element; text is always set via textContent so user-entered data can't inject HTML
function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
const vehicleName = v => v ? `${v.year} ${v.type}` : 'Deleted vehicle';
const fmtDate = s => new Date(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...options.headers }
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { signOut(); throw new Error('Session expired. Sign in again.'); }
  if (!res.ok) throw new Error(body.error || 'Request failed.');
  return body;
}

function signOut() {
  try { localStorage.removeItem('authToken'); } catch (e) {}
  location.replace('/');
}

// Revoke the token on the server, then leave (leave anyway if the server can't be reached)
$('logout').addEventListener('click', async () => {
  $('logout').disabled = true;
  try { await fetch('/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }); } catch (e) {}
  signOut();
});
$('refresh').addEventListener('click', () => load());

async function load() {
  $('appError').textContent = '';
  try {
    if (!me) {
      me = (await api('/auth/me')).user;
      if (me.role === 'customer') return location.replace('/app.html');
      $('who').textContent = me.name + ' (' + me.role + ')';
      $('usersTab').hidden = me.role !== 'admin';
      $('portalTitle').textContent = 'Laidlaw Auto Services \u00b7 ' + (me.role === 'admin' ? 'Admin' : 'Technician portal');
      parishes = await api('/auth/parishes');
      for (const p of parishes) { $('parishFilter').append(new Option(p, p)); $('uParish').append(new Option(p, p)); }
      // A technician starts on their own parish; they can switch to All parishes
      if (me.role === 'staff' && me.parish) $('parishFilter').value = me.parish;
    }
    data = await api('/admin/overview');
    await refreshEmergencies();
    if (me.role === 'admin') users = await api('/admin/users');
  } catch (err) {
    $('appError').textContent = err.message;
    return;
  }
  render();
  renderUsers();
}

function render() {
  const { counts, totals } = data;
  $('stats').replaceChildren(
    ...Object.keys(STATUS_LABELS).map(s => el('div', { className: 'stat' }, el('b', { textContent: counts[s] }), el('span', { textContent: STATUS_LABELS[s] }))),
    el('div', { className: 'stat' }, el('b', { textContent: totals.vehicles }), el('span', { textContent: 'Vehicles' })),
    el('div', { className: 'stat' }, el('b', { textContent: totals.owners }), el('span', { textContent: 'Owners' }))
  );
  document.querySelectorAll('.stat').forEach((n, i) => { n.dataset.s = Object.keys(STATUS_LABELS)[i] || ''; });
  renderRequests(); renderVehicles();
}

// --- Emergencies: roadside assistance and wrecker requests ---
let emergencies = [];
let knownOpen = null; // ids of open requests seen so far (null until the first load, so we don't beep for old ones)
const KIND_LABEL = { roadside: 'Roadside', towing: 'Towing' };
const ago = t => {
  const m = Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000));
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
};

function beep() {
  if (!$('emergSound').checked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  } catch (e) {}
}

async function refreshEmergencies() {
  try { emergencies = await api('/admin/emergencies'); } catch (err) { $('appError').textContent = err.message; return; }
  const open = emergencies.filter(e => e.status === 'open');
  if (knownOpen && open.some(e => !knownOpen.has(e.id) && (!$('parishFilter').value || e.parish === $('parishFilter').value))) beep();
  knownOpen = new Set(open.map(e => e.id));
  renderEmergencies();
}

async function emergencyAction(id, action) {
  try { await api('/admin/emergencies/' + id, { method: 'PATCH', body: JSON.stringify({ action }) }); }
  catch (err) { $('appError').textContent = err.message; }
  await refreshEmergencies();
}

function renderEmergencies() {
  const pf = $('parishFilter').value;
  const inView = emergencies.filter(e => !pf || e.parish === pf);
  const openAll = emergencies.filter(e => e.status === 'open' || e.status === 'dispatched').length;
  const openHere = inView.filter(e => e.status === 'open').length;
  $('emergTab').textContent = 'Emergencies' + (emergencies.some(e => e.status === 'open') ? ' (' + emergencies.filter(e => e.status === 'open').length + ' open)' : '');
  const elsewhere = emergencies.filter(e => e.status === 'open').length - openHere;
  $('emergNote').textContent = pf && elsewhere > 0 ? elsewhere + ' open in other parishes. Choose "All parishes" to see them.' : '';
  $('emergEmpty').hidden = inView.length > 0;
  const order = { open: 0, dispatched: 1, resolved: 2, cancelled: 3 };
  inView.sort((a, b) => order[a.status] - order[b.status] || b.id - a.id);
  $('emergList').replaceChildren(...inView.map(e => {
    const mine = e.technician && me && e.technician.id === me.id;
    const c = e.customer;
    const acts = el('div', { className: 'acts' });
    const btn = (label, cls, action, armed) => {
      const b = el('button', { className: 'btn ' + cls + ' small', textContent: label });
      if (armed) armDelete(b, () => emergencyAction(e.id, action), 'Confirm?'); else b.addEventListener('click', () => emergencyAction(e.id, action));
      return b;
    };
    if (e.status === 'open') acts.append(btn("I'll take this", 'safety', 'accept'));
    if (e.status === 'dispatched' && (mine || me.role === 'admin')) { acts.append(btn('Mark done', 'safety', 'resolve')); acts.append(btn('Hand back', 'ghost', 'release')); }
    if (me.role === 'admin' && (e.status === 'open' || e.status === 'dispatched')) { const x = btn('Cancel', 'danger', 'cancel', true); x.textContent = 'Cancel'; acts.append(x); }
    const where = [];
    if (e.locationText) where.push(el('span', { textContent: e.locationText }));
    if (e.latitude !== null && e.longitude !== null) {
      const q = e.latitude + ',' + e.longitude;
      where.push(el('a', { href: 'https://www.google.com/maps?q=' + q, target: '_blank', rel: 'noopener', textContent: 'Open exact location in Maps', style: 'margin-left:8px' }));
    }
    return el('div', { className: 'emerg ' + e.kind + ' ' + e.status },
      el('div', {},
        el('span', { className: 'kind', textContent: KIND_LABEL[e.kind] || e.kind }), ' ',
        el('span', { className: 'badge', textContent: e.status === 'dispatched' ? 'On the way' : e.status }), ' ',
        el('small', { textContent: ago(e.createdAt) + ' \u00b7 ' + e.parish }),
        el('p', {}, el('strong', { textContent: c ? c.name : 'Customer' }), ' ',
          el('a', { href: 'tel:' + e.phone.replace(/[^\d+]/g, ''), textContent: e.phone, style: 'font-weight:600' })),
        c && c.address ? el('p', {}, el('small', { textContent: 'Home address: ' + c.address })) : null,
        el('p', {}, el('strong', { textContent: 'Location: ' }), ...(where.length ? where : ['not given'])),
        e.vehicle ? el('p', { textContent: 'Vehicle: ' + e.vehicle }) : null,
        e.note ? el('p', { textContent: '"' + e.note + '"' }) : null,
        e.technician ? el('p', {}, el('small', { textContent: 'Accepted by ' + e.technician.name + (e.technician.phone ? ' (' + e.technician.phone + ')' : '') })) : null),
      acts);
  }));
}
setInterval(() => { if (!document.hidden && me) refreshEmergencies(); }, 20000);

// Who the customer is and how to reach them: name, phone, address, parish and their chassis photo
function customerCell(account, fallbackOwner) {
  if (!account) return [el('small', { textContent: fallbackOwner || '' })];
  const out = [el('strong', { className: 'who', textContent: account.name })];
  if (account.phone) out.push(el('a', { className: 'who', href: 'tel:' + account.phone.replace(/[^\d+]/g, ''), textContent: account.phone }));
  if (account.address) out.push(el('small', { className: 'who', textContent: account.address }));
  if (account.parish) out.push(el('span', { className: 'badge', textContent: account.parish }));
  const photo = el('button', { className: 'btn ghost small', textContent: 'Chassis photo', style: 'margin-top:4px' });
  photo.addEventListener('click', () => openPhoto(account.id));
  out.push(el('br'), photo);
  return out;
}
async function openPhoto(userId) {
  const w = window.open('', '_blank'); // opened first so the browser doesn't block it
  try {
    const r = await api('/admin/users/' + userId + '/chassis-photo');
    if (w) w.location = r.url; else $('appError').textContent = 'Allow pop-ups to view the photo.';
  } catch (err) { if (w) w.close(); $('appError').textContent = err.message; }
}
const parishOf = account => (account && account.parish) || '';
const matchesParish = account => !$('parishFilter').value || parishOf(account) === $('parishFilter').value;

function renderRequests() {
  const q = $('reqSearch').value.trim().toLowerCase(), st = $('reqStatus').value;
  const rows = data.requests.filter(r =>
    (!st || r.status === st) && matchesParish(r.vehicle && r.vehicle.account) &&
    (!q || [r.vehicle && r.vehicle.owner, vehicleName(r.vehicle), r.description, r.category].join(' ').toLowerCase().includes(q)));
  $('reqEmpty').hidden = rows.length > 0;
  $('reqBody').replaceChildren(...rows.map(r => {
    const sel = el('select', { ariaLabel: 'Change status' },
      ...Object.entries(STATUS_LABELS).map(([v, l]) => el('option', { value: v, textContent: l, selected: v === r.status })));
    sel.addEventListener('change', async () => {
      try {
        await api('/admin/service-request/' + r.id, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
        await load();
      } catch (err) { $('appError').textContent = err.message; sel.value = r.status; }
    });
    const del = el('button', { className: 'btn danger small', textContent: 'Delete', hidden: me.role !== 'admin' });
    armDelete(del, async () => { await api('/admin/service-request/' + r.id, { method: 'DELETE' }); await load(); });
    return el('tr', {},
      el('td', { textContent: r.id }),
      el('td', {}, el('strong', { textContent: vehicleName(r.vehicle) }), el('br'), ...customerCell(r.vehicle && r.vehicle.account, r.vehicle && r.vehicle.owner)),
      el('td', { className: 'desc' }, el('span', { className: 'badge', textContent: r.category, style: 'margin-right:6px' }), r.description),
      el('td', {}, sel),
      el('td', { textContent: fmtDate(r.createdAt) }),
      el('td', { className: 'act' }, del));
  }));
}

function renderVehicles() {
  const q = $('vehSearch').value.trim().toLowerCase();
  const jobs = new Map();
  data.requests.forEach(r => jobs.set(r.vehicleId, (jobs.get(r.vehicleId) || 0) + 1));
  const rows = data.vehicles.filter(v => matchesParish(v.account) && (!q || [v.owner, v.type, v.year, v.vin, v.account && v.account.name, v.account && v.account.phone].join(' ').toLowerCase().includes(q)));
  $('vehEmpty').hidden = rows.length > 0;
  $('vehBody').replaceChildren(...rows.map(v => {
    const n = jobs.get(v.id) || 0;
    const del = el('button', { className: 'btn danger small', textContent: 'Delete', hidden: me.role !== 'admin' });
    armDelete(del, async () => { await api('/admin/vehicle/' + v.id, { method: 'DELETE' }); await load(); },
      n ? `Delete + ${n} job${n > 1 ? 's' : ''}?` : 'Confirm?');
    return el('tr', {},
      el('td', { textContent: v.id }), el('td', {}, ...(v.account ? customerCell(v.account) : [v.owner])),
      el('td', {}, v.type, el('br'), el('small', { textContent: v.category })),
      el('td', { textContent: v.year }), el('td', { textContent: v.vin || '—' }),
      el('td', { textContent: n }), el('td', { className: 'act' }, del));
  }));
}

function renderPending() {
  const pending = users.filter(u => u.approved === false);
  $('usersTab').textContent = 'Users' + (pending.length ? ' (' + pending.length + ' to approve)' : '');
  $('pendingBox').hidden = !pending.length;
  if (!pending.length) return;
  $('pendingBox').replaceChildren(
    el('strong', { textContent: pending.length + ' service member application' + (pending.length > 1 ? 's' : '') + ' waiting for approval' }),
    el('p', { className: 'empty', textContent: 'Approved members can see customer phone numbers, addresses and chassis photos. Check their details first.' }),
    ...pending.map(u => {
      const ok = el('button', { className: 'btn safety small', textContent: 'Approve' });
      ok.addEventListener('click', () => patchUser(u.id, { approved: true }));
      const no = el('button', { className: 'btn danger small', textContent: 'Reject' });
      armDelete(no, async () => { await api('/admin/users/' + u.id, { method: 'DELETE' }); await load(); }, 'Confirm reject?');
      return el('div', { className: 'app' },
        el('div', {},
          el('strong', { textContent: u.name }), u.businessName ? ' \u00b7 ' + u.businessName : '', el('br'),
          el('span', { className: 'who', textContent: u.email + ' \u00b7 ' + u.phone }),
          el('span', { className: 'who', textContent: u.address + (u.parish ? ', ' + u.parish : '') }),
          el('span', { className: 'who' }, 'Does: ' + u.specialties.join(', ')),
          el('small', { className: 'who', textContent: u.experience })),
        el('div', { className: 'acts', style: 'display:flex;flex-direction:column;gap:6px' }, ok, no));
    }));
}

function renderUsers() {
  if (me.role !== 'admin') return;
  renderPending();
  $('userBody').replaceChildren(...users.filter(u => u.approved !== false).map(u => {
    const isMe = u.id === me.id;
    const role = el('select', { ariaLabel: 'Role', disabled: isMe },
      ...['customer', 'staff', 'admin'].map(r => el('option', { value: r, textContent: r, selected: r === u.role })));
    role.addEventListener('change', () => patchUser(u.id, { role: role.value }));
    const toggle = el('button', { className: 'btn ghost small', textContent: u.active ? 'Disable' : 'Enable', hidden: isMe });
    toggle.addEventListener('click', () => patchUser(u.id, { active: !u.active }));
    const reset = el('button', { className: 'btn ghost small', textContent: 'Reset password' });
    reset.addEventListener('click', () => {
      const box = el('input', { type: 'text', placeholder: 'New password (8+)', autocomplete: 'off', style: 'width:150px;padding:4px 6px' });
      const ok = el('button', { className: 'btn safety small', textContent: 'Save' });
      ok.addEventListener('click', () => patchUser(u.id, { password: box.value }));
      reset.replaceWith(box, ' ', ok); box.focus();
    });
    const del = el('button', { className: 'btn danger small', textContent: 'Delete', hidden: isMe });
    armDelete(del, async () => { await api('/admin/users/' + u.id, { method: 'DELETE' }); await load(); });
    const parish = el('select', { ariaLabel: 'Parish' }, el('option', { value: '', textContent: u.role === 'staff' ? 'Not assigned' : '-' }),
      ...parishes.map(p => el('option', { value: p, textContent: p, selected: p === u.parish })));
    parish.addEventListener('change', () => patchUser(u.id, { parish: parish.value }));
    const photo = el('button', { className: 'btn ghost small', textContent: 'Chassis photo', hidden: !u.hasChassisPhoto });
    photo.addEventListener('click', () => openPhoto(u.id));
    return el('tr', {},
      el('td', {}, el('strong', { textContent: u.name + (isMe ? ' (you)' : '') }), el('br'), el('small', { textContent: 'Joined ' + fmtDate(u.createdAt) })),
      el('td', {}, el('span', { className: 'who', textContent: u.email }), u.phone ? el('span', { className: 'who', textContent: u.phone }) : null, u.address ? el('small', { className: 'who', textContent: u.address }) : null),
      el('td', {}, role),
      el('td', {}, parish),
      el('td', {}, el('span', { className: u.active ? 'badge' : 'badge off', textContent: u.active ? 'Active' : 'Disabled' })),
      el('td', { className: 'act' }, photo, ' ', toggle, ' ', reset, ' ', del));
  }));
}
async function patchUser(id, body) {
  try { await api('/admin/users/' + id, { method: 'PATCH', body: JSON.stringify(body) }); await load(); }
  catch (err) { $('appError').textContent = err.message; renderUsers(); }
}
$('userForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await api('/admin/users', { method: 'POST', body: JSON.stringify({
      name: $('uName').value, email: $('uEmail').value, password: $('uPass').value, role: $('uRole').value, phone: $('uPhone').value, parish: $('uParish').value }) });
    e.target.reset(); await load();
  } catch (err) { $('appError').textContent = err.message; }
});

// Two-step delete (the viewer may block confirm() dialogs): first click arms, second click deletes
function armDelete(btn, action, armedLabel = 'Confirm?') {
  let timer;
  const label = btn.textContent; // put the original wording back if they don't confirm
  btn.addEventListener('click', async () => {
    if (!btn.dataset.armed) {
      btn.dataset.armed = '1'; btn.textContent = armedLabel;
      timer = setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 4000);
      return;
    }
    clearTimeout(timer);
    try { await action(); } catch (err) { $('appError').textContent = err.message; delete btn.dataset.armed; btn.textContent = label; }
  });
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('emergPanel').hidden = b.dataset.tab !== 'emergencies';
  $('requestsPanel').hidden = b.dataset.tab !== 'requests';
  $('vehiclesPanel').hidden = b.dataset.tab !== 'vehicles';
  $('usersPanel').hidden = b.dataset.tab !== 'users';
}));
$('parishFilter').addEventListener('change', () => { renderRequests(); renderVehicles(); renderEmergencies(); });
$('reqSearch').addEventListener('input', renderRequests);
$('reqStatus').addEventListener('change', renderRequests);
$('vehSearch').addEventListener('input', renderVehicles);

if (token) load(); else location.replace('/');
</script>
</body>
