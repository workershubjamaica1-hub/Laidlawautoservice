<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Laidlaw Auto Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1D2731; --ink-soft: #4A5663; --surface: #E6E9EC; --card: #FBFBFA; --line: #C9CFD5;
    --safety: #F2B705; --red: #B83A2B;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font: 16px/1.5 var(--body); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
  [hidden] { display: none !important; }

  header { background: var(--ink); color: #fff; display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 6px solid var(--safety); }
  header h1 { font: 700 28px/1 var(--display); margin: 0; }

  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
  h2 { font: 700 28px/1.1 var(--display); margin: 0 0 4px; }
  .sub { color: var(--ink-soft); margin: 0 0 8px; font-size: 15px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .tabs button { padding: 9px; background: #fff; border: 0; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }

  label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 4px; }
  input { width: 100%; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .pw { position: relative; }
  .pw input { padding-right: 64px; }
  .show { position: absolute; right: 4px; top: 4px; bottom: 4px; padding: 0 10px; background: none; border: 0; color: var(--ink-soft); font-size: 14px; font-weight: 600; cursor: pointer; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
  .btn { width: 100%; margin-top: 18px; padding: 11px 16px; background: var(--safety); color: var(--ink); border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #FFC81F; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--red); font-size: 14px; margin: 10px 0 0; min-height: 1.4em; }
</style>
</head>
<body>
<header><h1>Laidlaw Auto Services</h1></header>
<main>
  <div class="card">
    <h2 id="title">Welcome back</h2>
    <p class="sub" id="sub">Sign in to manage your vehicles and service requests.</p>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true" aria-controls="form">Sign in</button>
      <button role="tab" id="tab-register" aria-selected="false" aria-controls="form">Create account</button>
    </div>

    <form id="form" novalidate>
      <div id="nameRow" hidden>
        <label for="name">Full name</label>
        <input id="name" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required autofocus>
      <label for="pw">Password</label>
      <div class="pw">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="button" class="show" id="show" aria-controls="pw">Show</button>
      </div>
      <p class="hint" id="pwHint" hidden>At least 8 characters.</p>
      <button class="btn" id="submit" type="submit">Sign in</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let mode = 'login';

// Where each kind of user lands after signing in
const home = role => role === 'customer' ? '/app.html' : '/admin.html';

// Already signed in? Check the saved session, then skip this page
(async () => {
  let token = '';
  try { token = localStorage.getItem('authToken') || ''; } catch (e) {}
  if (!token) return;
  try {
    const res = await fetch('/auth/me', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) return location.replace(home((await res.json()).user.role));
  } catch (e) {}
  try { localStorage.removeItem('authToken'); } catch (e) {}
})();

function setMode(m) {
  mode = m;
  const reg = m === 'register';
  $('tab-login').setAttribute('aria-selected', !reg);
  $('tab-register').setAttribute('aria-selected', reg);
  $('nameRow').hidden = !reg;
  $('pwHint').hidden = !reg;
  $('pw').autocomplete = reg ? 'new-password' : 'current-password';
  $('title').textContent = reg ? 'Create your account' : 'Welcome back';
  $('sub').textContent = reg ? 'Customers: sign up to add your vehicles and book services.' : 'Sign in to manage your vehicles and service requests.';
  $('submit').textContent = reg ? 'Create account' : 'Sign in';
  $('error').textContent = '';
}
$('tab-login').addEventListener('click', () => setMode('login'));
$('tab-register').addEventListener('click', () => setMode('register'));

$('show').addEventListener('click', () => {
  const hidden = $('pw').type === 'password';
  $('pw').type = hidden ? 'text' : 'password';
  $('show').textContent = hidden ? 'Hide' : 'Show';
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('error').textContent = '';
  const body = { email: $('email').value, password: $('pw').value };
  if (mode === 'register') body.name = $('name').value;
  $('submit').disabled = true;
  try {
    const res = await fetch(mode === 'register' ? '/auth/register' : '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not sign in.');
    localStorage.setItem('authToken', data.token);
    location.replace(home(data.user.role));
  } catch (err) {
    $('error').textContent = err.message;
    if (mode === 'login') $('pw').select();
  } finally {
    $('submit').disabled = false;
  }
});
</script>
</body>
</html>
